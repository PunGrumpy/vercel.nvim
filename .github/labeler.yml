core:
  - all:
      - changed-files:
          - any-glob-to-any-file: "lua/vercel/**"
          - all-globs-to-all-files:
              - "!lua/vercel/groups/**"
              - "!lua/vercel/colors/**"
              - "!lua/vercel/extra/**"

extras:
  - changed-files:
      - any-glob-to-any-file: "lua/vercel/extra/**"

groups:
  - changed-files:
      - any-glob-to-any-file: "lua/vercel/groups/**"

base:
  - changed-files:
      - any-glob-to-any-file:
          - "lua/vercel/groups/base.lua"
          - "lua/vercel/groups/kinds.lua"
          - "lua/vercel/groups/treesitter.lua"
          - "lua/vercel/groups/semantic_tokens.lua"

colors:
  - changed-files:
      - any-glob-to-any-file: "lua/vercel/colors/**"
